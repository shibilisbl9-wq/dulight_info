<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="DULIGHT - Premium lighting solutions redefining modern illumination" />
  <title>DULIGHT - Redefining Lights</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      /* THEME: base brand color */
      --orange-100: #FFF3E6;
      --orange-200: #FFE3C2;
      --orange-300: #FFD09A;
      --orange-400: #FFB45C;
      --orange-500: #FF9519; /* main */
      --orange-600: #E57F00;
      --orange-700: #B86200;

      --white: #ffffff;
      --grey-50: #fafafa;
      --grey-100: #f5f5f7;
      --grey-200: #e8e8ed;
      --grey-300: #d1d1d6;
      --grey-600: #6b6b73;
      --grey-800: #2d2d30;
      --grey-900: #1a1a1c;

      --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.12);
      --shadow-xl: 0 16px 48px rgba(0, 0, 0, 0.16);
      --shadow-phone: 0 25px 80px rgba(0, 0, 0, 0.18), 0 8px 24px rgba(0, 0, 0, 0.08);

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-2xl: 24px;
      --radius-full: 9999px;

      --ease-out: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

      --duration-fast: 150ms;
      --duration-normal: 250ms;
      --duration-slow: 350ms;
      --duration-slower: 450ms;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #e8e8ed 0%, #f5f5f7 50%, #e8e8ed 100%);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 24px;
      line-height: 1.5;
      color: var(--grey-900);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .phone-container {
      width: 100%;
      max-width: 420px;
      background: var(--white);
      border-radius: 44px;
      overflow: hidden;
      box-shadow: var(--shadow-phone);
      position: relative;
    }

    /* CHANGE: remove the black notch/box completely (some browsers were showing it) */
    .phone-container::before {
      display: none;
      content: none;
    }

    .header {
      height: 220px;
      background: linear-gradient(
        180deg,
        #FFC067 0%,
        var(--orange-400) 20%,
        var(--orange-500) 50%,
        var(--orange-600) 80%,
        var(--orange-700) 100%
      );
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center top, rgba(255, 255, 255, 0.16) 0%, transparent 60%);
      pointer-events: none;
    }

    /* CHANGE: circular pattern overlay on the top colored block */
    .header::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABMAAAAJACAYAAADQ5sYJAAAACXBIWXMAAAsSAAALEgHS3X78AAAgAElEQVR4nOzdeZyV5d0/8M8yS6q0o7l2p8lq0oR8aYqI2WQ4gYpZkJd...REDACTED_FOR_CANMORE..." );
      background-size: cover;
      background-position: center;
      opacity: 0.22;
      mix-blend-mode: soft-light;
      pointer-events: none;
    }

    .header-rings {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translate(-50%, 55%);
      width: 380px;
      height: auto;
      max-width: 100%;
      object-fit: contain;
      pointer-events: none;
      opacity: 0.85;
      filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.1));
    }

    .logo-coin-wrapper {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translate(-50%, 50%);
      z-index: 20;
    }

    .logo-coin {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--white);
      border: 3px solid var(--orange-500);
      box-shadow: 0 4px 20px rgba(255, 107, 53, 0.25), 0 8px 32px rgba(0, 0, 0, 0.1), inset 0 -2px 4px rgba(0, 0, 0, 0.02);
    }

    /* CHANGE: circle replacement image (put your provided circle image here) */
    .logo-coin .coin-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      opacity: 1;
    }

    /* CHANGE: logo always on top */
    .logo-coin .coin-logo {
      position: relative;
      z-index: 1;
      width: 68%;
      height: 68%;
      object-fit: contain;
      filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.12));
    }

    .main-content {
      padding: 56px 22px 22px;
      background: var(--white);
    }

    .title {
      text-align: center;
      margin-bottom: 18px;
    }

    .title h1 {
      font-size: 1.75rem;
      font-weight: 600;
      color: var(--grey-900);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .contact-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .contact-pill {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--grey-200);
      border-radius: var(--radius-lg);
      padding: 12px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: transform var(--duration-normal) var(--ease-out), box-shadow var(--duration-normal) var(--ease-out),
        border-color var(--duration-normal) var(--ease-out);
      position: relative;
      overflow: hidden;
    }

    .contact-pill::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--orange-100), transparent);
      opacity: 0;
      transition: opacity var(--duration-normal) var(--ease-out);
    }

    .contact-pill:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--orange-200);
    }

    .contact-pill:hover::before {
      opacity: 1;
    }

    .contact-pill:active {
      transform: translateY(-2px) scale(0.98);
      box-shadow: var(--shadow-md);
    }

    .contact-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(145deg, var(--orange-400), var(--orange-600));
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
      box-shadow: 0 2px 8px rgba(255, 107, 53, 0.3);
    }

    .contact-icon svg {
      width: 18px;
      height: 18px;
      fill: var(--white);
    }

    .contact-info {
      overflow: hidden;
      position: relative;
      z-index: 1;
      min-width: 0;
    }

    .contact-label {
      display: none;
    }

    .contact-value {
      font-size: 0.95rem;
      color: var(--grey-900);
      font-weight: 600;
      line-height: 1.3;
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      word-break: break-word;
    }

    .gallery-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .gallery-card {
      position: relative;
      border-radius: var(--radius-xl);
      padding: 18px;
      min-height: 132px;
      cursor: pointer;
      overflow: hidden;
      transition: transform var(--duration-slow) var(--ease-out), box-shadow var(--duration-slow) var(--ease-out);
    }

    .project-gallery-card {
      background: linear-gradient(145deg, var(--grey-100), var(--grey-50));
      border: 1px solid var(--grey-200);
    }

    /* CHANGE: project card uses Trillionaire (Binghatti) building as a faded background */
    .project-gallery-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: var(--project-bg, url("/assets/trillionaire-binghatti.jpg"));
      background-size: cover;
      background-position: center;
      opacity: 0.28; /* faded by default */
      transform: scale(1.03);
      filter: blur(0);
      transition: opacity var(--duration-slower) var(--ease-out), transform var(--duration-slower) var(--ease-out),
        filter var(--duration-slower) var(--ease-out);
      z-index: 0;
    }

    .project-gallery-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(255, 149, 25, 0.06) 0%,
        rgba(0, 0, 0, 0.32) 55%,
        rgba(0, 0, 0, 0.55) 100%
      );
      opacity: 1;
      transition: opacity var(--duration-slower) var(--ease-out);
      z-index: 1;
    }

    .project-gallery-card:hover,
    .project-gallery-card.touch-active {
      transform: translateY(-6px);
      box-shadow: var(--shadow-xl);
    }

    .project-gallery-card:hover::before,
    .project-gallery-card.touch-active::before {
      opacity: 0.9;
      transform: scale(1);
      filter: blur(0);
    }

    .project-gallery-card:hover::after,
    .project-gallery-card.touch-active::after {
      opacity: 1;
    }

    .project-gallery-card:hover .card-content,
    .project-gallery-card.touch-active .card-content {
      color: var(--white);
    }

    .project-gallery-card:hover .card-badge,
    .project-gallery-card.touch-active .card-badge {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      color: var(--white);
    }

    .project-gallery-card:hover .card-dots,
    .project-gallery-card.touch-active .card-dots {
      color: rgba(255, 255, 255, 0.7);
    }

    .product-gallery-card {
      background: linear-gradient(145deg, var(--orange-400) 0%, var(--orange-500) 50%, var(--orange-600) 100%);
      color: var(--white);
      box-shadow: 0 4px 20px rgba(255, 107, 53, 0.25);
    }

    /* CHANGE: product card gets a subtle randomized spotlight photo (curated) */
    .product-gallery-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: var(--product-bg);
      background-size: cover;
      background-position: center;
      opacity: 0.18;
      filter: saturate(1.05) contrast(1.05);
      mix-blend-mode: soft-light;
      z-index: 0;
      pointer-events: none;
    }

    /* keep shine effect above bg, below content */
    .product-gallery-card::before {
      z-index: 1;
    }

    .product-gallery-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.1) 30%,
        rgba(255, 255, 255, 0.3) 50%,
        rgba(255, 255, 255, 0.1) 70%,
        transparent 100%
      );
      transform: skewX(-20deg);
      transition: left 0.7s var(--ease-out);
      z-index: 1;
    }

    .product-gallery-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 40px rgba(255, 107, 53, 0.4), 0 4px 16px rgba(255, 107, 53, 0.2);
    }

    .product-gallery-card:hover::before {
      left: 150%;
    }

    .product-gallery-card:active {
      transform: translateY(-3px) scale(0.99);
    }

    .card-content {
      position: relative;
      z-index: 3;
      transition: color var(--duration-slow) var(--ease-out);
    }

    .card-badge {
      display: inline-block;
      background: rgba(0, 0, 0, 0.06);
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
      transition: background var(--duration-slow) var(--ease-out), color var(--duration-slow) var(--ease-out);
    }

    .product-gallery-card .card-badge {
      background: rgba(255, 255, 255, 0.2);
      color: var(--white);
    }

    .card-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 2px;
    }

    .card-dots {
      font-size: 1.4rem;
      opacity: 0.4;
      letter-spacing: 3px;
      font-weight: 700;
      transition: color var(--duration-slow) var(--ease-out);
    }

    .product-gallery-card .card-dots {
      opacity: 0.6;
    }

    .product-thumb {
      position: absolute;
      bottom: 8px;
      right: 8px;
      width: 104px;
      height: 104px;
      object-fit: contain;
      opacity: 0.95;
      z-index: 2;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.15));
      transition: transform var(--duration-normal) var(--ease-spring);
    }

    .product-gallery-card:hover .product-thumb {
      transform: scale(1.05) rotate(2deg);
    }

    .social-section {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .social-btn {
      width: 44px;
      height: 44px;
      background: var(--grey-100);
      border: 1px solid var(--grey-200);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: background var(--duration-normal) var(--ease-out), border-color var(--duration-normal) var(--ease-out),
        transform var(--duration-normal) var(--ease-spring), box-shadow var(--duration-normal) var(--ease-out);
    }

    .social-btn svg {
      width: 22px;
      height: 22px;
      fill: var(--grey-600);
      transition: fill var(--duration-normal) var(--ease-out);
    }

    .social-btn:hover {
      background: var(--orange-500);
      border-color: var(--orange-500);
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(255, 107, 53, 0.35);
    }

    .social-btn:hover svg {
      fill: var(--white);
    }

    .social-btn:active {
      transform: translateY(-2px) scale(0.96);
    }

    .footer {
      text-align: center;
      padding-top: 16px;
      position: relative;
    }

    .footer::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, var(--orange-300) 20%, var(--orange-500) 50%, var(--orange-300) 80%,
        transparent 100%);
      border-radius: 2px;
    }

    .footer-text {
      font-size: 0.7rem;
      color: var(--grey-600);
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    @media (max-width: 480px) {
      body {
        padding: 0;
        background: var(--white);
        align-items: stretch;
      }

      .phone-container {
        border-radius: 0;
        box-shadow: none;
        max-width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
      }

      .header {
        border-radius: 0;
      }

      .main-content {
        padding: 64px 20px 40px;
      }

      .project-gallery-card::before {
        opacity: 0.7;
        transform: scale(1);
        filter: blur(0);
      }

      .project-gallery-card::after {
        opacity: 1;
      }

      .project-gallery-card .card-content {
        color: var(--white);
      }

      .project-gallery-card .card-badge {
        background: rgba(255, 255, 255, 0.2);
        color: var(--white);
      }

      .project-gallery-card .card-dots {
        color: rgba(255, 255, 255, 0.7);
      }

      .contact-pill {
        padding: 12px 10px;
      }

      .contact-icon {
        width: 36px;
        height: 36px;
      }

      .contact-icon svg {
        width: 16px;
        height: 16px;
      }

      .contact-value {
        font-size: 0.75rem;
      }
    }

    @media (min-width: 481px) and (max-width: 520px) {
      body {
        padding: 24px 16px;
      }
    }

    @media (min-width: 768px) {
      body {
        align-items: center;
        padding: 48px 24px;
      }
    }

    @media (hover: none) and (pointer: coarse) {
      .contact-pill:hover {
        transform: none;
        box-shadow: none;
        border-color: var(--grey-200);
      }

      .contact-pill:hover::before {
        opacity: 0;
      }

      .contact-pill:active {
        transform: scale(0.98);
        background: var(--grey-50);
      }

      .social-btn:hover {
        background: var(--grey-100);
        border-color: var(--grey-200);
        transform: none;
        box-shadow: none;
      }

      .social-btn:hover svg {
        fill: var(--grey-600);
      }

      .social-btn:active {
        background: var(--orange-500);
        border-color: var(--orange-500);
      }

      .social-btn:active svg {
        fill: var(--white);
      }

      .gallery-card:hover {
        transform: none;
        box-shadow: none;
      }

      .product-gallery-card:hover {
        box-shadow: 0 4px 20px rgba(255, 107, 53, 0.25);
      }

      .product-gallery-card:hover::before {
        left: -100%;
      }

      .product-gallery-card:active {
        transform: scale(0.98);
      }

      .product-gallery-card:active::before {
        left: 150%;
      }
    }
  </style>
</head>

<body>

    <header class="header">
      <img src="/assets/hero-rings.png" alt="" class="header-rings" aria-hidden="true" loading="eager" />

      <div class="logo-coin-wrapper">

          <img class="coin-bg" src="/assets/circle-replacement.png" alt="" aria-hidden="true" loading="eager" />

          <img class="coin-logo" src="/assets/dulight-logo.png" alt="DULIGHT Logo" loading="eager" />
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="title">
        <h1>redefining lights.</h1>
      </div>

      <nav class="contact-grid" aria-label="Contact Information">
        <a href="tel:+97148808115" class="contact-pill">

        <a href="mailto:admin@dulights.com" class="contact-pill">
          <div class="contact-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

          <div class="contact-info">

          <div class="contact-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z" />

          <div class="contact-info">

          </div>

        <a href="https://maps.app.goo.gl/nbfjws5y2re8yzxV6" class="contact-pill" target="_blank" rel="noopener noreferrer">
          <div class="contact-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" />
            </svg>
          </div>
          <div class="contact-info">
            <span class="contact-value">Jafza, Dubai, UAE</span>
          </div>
        </a>
